<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="220" viewBox="0 0 1000 220" role="img" aria-labelledby="title desc"><title id="title">Launchcheck</title><desc id="desc">Ship with fewer surprises. A gently sweeping launch-readiness indicator.</desc><rect width="1000" height="220" rx="18" fill="#173b35"/><g fill="none" stroke="#35584b"><circle cx="885" cy="110" r="72"/><circle cx="885" cy="110" r="48"/><path d="M813 110h144M885 38v144"/></g><circle cx="885" cy="110" r="72" stroke="#c7f18b" stroke-width="3" stroke-dasharray="60 393" fill="none"><animateTransform attributeName="transform" type="rotate" from="0 885 110" to="360 885 110" dur="12s" repeatCount="indefinite"/></circle><text x="500" y="105" font-family="Arial,Helvetica,sans-serif" font-size="64" font-weight="700" letter-spacing="-3" text-anchor="middle" fill="#fafff4">Launchcheck</text><text x="500" y="146" font-family="Arial,Helvetica,sans-serif" font-size="20" text-anchor="middle" fill="#c7f18b">Ship with fewer surprises.</text><path d="M420 178h160" stroke="#426548" stroke-width="3" stroke-linecap="round"/><path d="M420 178h160" stroke="#c7f18b" stroke-width="3" stroke-linecap="round" stroke-dasharray="40 120"><animate attributeName="stroke-dashoffset" values="0;-160" dur="4s" repeatCount="indefinite"/></path></svg>
